<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raksha Bandhan 2026 - Sisters Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital,wght@0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0d0103 0%, #24050b 50%, #120104 100%);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Background Glow Orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.18;
      pointer-events: none;
      animation: floatOrbs 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      top: -120px;
      left: -120px;
      width: 400px;
      height: 400px;
      background: #ff3366;
    }

    .orb-2 {
      bottom: -120px;
      right: -120px;
      width: 450px;
      height: 450px;
      background: #e60026;
      animation-delay: -6s;
    }

    @keyframes floatOrbs {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.15); }
    }

    /* Canvas for Sparkle Particle Rain */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .screen {
      display: none;
      min-height: 100vh;
      width: 100%;
      padding: 30px 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      animation: cinematicFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes cinematicFade {
      from { opacity: 0; transform: scale(0.95) translateY(15px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Interface 1: Master Lock Screen */
    #lockScreen {
      background: radial-gradient(circle at center, rgba(50, 7, 16, 0.85) 0%, rgba(15, 2, 5, 0.95) 100%);
    }

    .lock-card {
      background: rgba(25, 2, 6, 0.85);
      border: 2px solid rgba(255, 77, 121, 0.6);
      padding: 45px 35px;
      border-radius: 28px;
      text-align: center;
      backdrop-filter: blur(25px);
      box-shadow: 0 25px 60px rgba(255, 51, 102, 0.25), inset 0 0 20px rgba(255, 77, 121, 0.1);
      width: 100%;
      max-width: 440px;
      animation: pulseBorder 4s ease-in-out infinite;
    }

    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(255, 77, 121, 0.5); box-shadow: 0 25px 60px rgba(255, 51, 102, 0.25); }
      50% { border-color: rgba(255, 150, 180, 0.9); box-shadow: 0 30px 70px rgba(255, 77, 121, 0.45); }
    }

    .lock-card h1 {
      font-family: 'Cinzel Decorative', serif;
      color: #ff85a2;
      font-size: 2.2rem;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(255, 133, 162, 0.6);
    }

    .lock-card p {
      color: #f7ccd4;
      font-size: 1rem;
      margin-bottom: 25px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }

    .lock-card input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 77, 121, 0.6);
      background: rgba(10, 1, 3, 0.9);
      color: #fff;
      font-size: 1.15rem;
      text-align: center;
      outline: none;
      margin-bottom: 20px;
      letter-spacing: 3px;
      font-family: 'Montserrat', sans-serif;
    }

    .lock-card input:focus {
      border-color: #ff85a2;
      box-shadow: 0 0 20px rgba(255, 77, 121, 0.6);
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ff3366, #8b0022);
      color: #ffffff;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 1px;
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 25px rgba(139, 0, 34, 0.6);
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 51, 102, 0.5);
      opacity: 0.95;
    }

    .error-text {
      color: #ff6b8b;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    /* Interface 2: The Sisters Hub Index */
    #hubScreen {
      justify-content: flex-start;
      padding-top: 40px;
    }

    .hub-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .hub-header h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2.2rem, 4.5vw, 3.5rem);
      color: #ff85a2;
      text-shadow: 0 0 25px rgba(255, 133, 162, 0.5);
      margin-bottom: 10px;
    }

    .hub-header p {
      color: #f7ccd4;
      font-size: 1.1rem;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      opacity: 0.95;
    }

    .sisters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1200px;
      padding-bottom: 60px;
    }

    .sister-hub-card {
      background: rgba(35, 6, 12, 0.75);
      border: 1px solid rgba(255, 77, 121, 0.35);
      border-radius: 20px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      backdrop-filter: blur(15px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
    }

    .sister-hub-card:hover {
      transform: translateY(-6px) scale(1.02);
      background: rgba(55, 10, 20, 0.9);
      border-color: #ff85a2;
      box-shadow: 0 20px 45px rgba(255, 51, 102, 0.35);
    }

    .square-photo-box {
      width: 72px;
      height: 72px;
      min-width: 72px;
      border-radius: 14px;
      background: rgba(17, 1, 3, 0.85);
      border: 1px dashed rgba(255, 133, 162, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.3s ease;
    }

    .sister-hub-card:hover .square-photo-box {
      border-color: #ff85a2;
    }

    .square-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .card-info span {
      font-size: 0.75rem;
      color: #ff85a2;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.9;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
    }

    /* Interface 3: Individual Sister Detail Display */
    #detailScreen {
      justify-content: center;
    }

    .detail-card {
      background: rgba(25, 2, 6, 0.92);
      border: 2px solid rgba(255, 77, 121, 0.65);
      border-radius: 30px;
      padding: 50px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(25px);
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.85), 0 0 35px rgba(255, 51, 102, 0.25);
      animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .detail-photo-box {
      width: 120px;
      height: 120px;
      margin: 0 auto 22px;
      border-radius: 20px;
      background: rgba(21, 2, 5, 0.95);
      border: 2px solid #ff3366;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 51, 102, 0.45);
    }

    .detail-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-card h2 {
      font-family: 'Cinzel Decorative', serif;
      color: #ff85a2;
      font-size: 2.2rem;
      margin-bottom: 22px;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255, 133, 162, 0.4);
    }

    .quote-box {
      background: rgba(255, 77, 121, 0.08);
      border-left: 4px solid #ff3366;
      padding: 24px;
      border-radius: 0 16px 16px 0;
      margin-bottom: 35px;
      text-align: left;
    }

    .quote-box p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #f7ccd4;
      font-size: 1.15rem;
      line-height: 1.8;
    }

    .back-btn {
      background: transparent;
      border: 1px solid rgba(255, 77, 121, 0.6);
      color: #ff85a2;
      padding: 12px 30px;
      border-radius: 14px;
      font-weight: 500;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 77, 121, 0.2);
      border-color: #ff85a2;
      color: #fff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Magical Background Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Particle Sparkle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Interface 1: Master Lock Screen -->
  <div id="lockScreen" class="screen active">
    <div class="lock-card">
      <h1>Raksha Bandhan</h1>
      <p>Enter the secure master key to access the family sanctuary</p>
      <input type="password" id="masterInput" placeholder="Enter key..." autocomplete="off">
      <button class="action-btn" onclick="verifyMasterKey()">Unlock Hub</button>
      <div id="lockError" class="error-text">Incorrect key. Hint: use "didi"</div>
    </div>
  </div>

  <!-- Interface 2: Sisters Hub Index -->
  <div id="hubScreen" class="screen">
    <div class="hub-header">
      <h2>Raksha Bandhan 2026</h2>
      <p>Select any name below to view your personalized greeting</p>
    </div>
    <div class="sisters-grid" id="sistersGrid">
      <!-- Generated dynamically -->
    </div>
  </div>

  <!-- Interface 3: Individual Sister Detail Display -->
  <div id="detailScreen" class="screen">
    <div class="detail-card">
      <div class="detail-photo-box" id="detailPhotoContainer">
        <span style="font-size: 12px; color: #ff85a2; display: flex; align-items: center; justify-content: center; height: 100%; font-family: 'Montserrat', sans-serif;">Photo</span>
      </div>
      <h2 id="detailTitle">Sister Name</h2>
      <div class="quote-box">
        <p id="detailQuote">Quote goes here...</p>
      </div>
      <button class="back-btn" onclick="goBackToHub()">← Return to Hub</button>
    </div>
  </div>

  <script>
    const MASTER_KEY = "didi";

    const sistersData = [
      {
        id: "madhu",
        name: "Madhu Didi",
        quote: "Madhu Didi, you hold a truly unique and irreplaceable place in my heart. Your unmatched grace, steady guidance, and constant presence make every single milestone of life infinitely brighter and more meaningful.",
        img: ""
      },
      {
        id: "deepa",
        name: "Deepa Didi",
        quote: "Your wisdom and warmth create a comforting shelter through every season of life. Thank you for always bringing clarity and joy wherever you go.",
        img: ""
      },
      {
        id: "jyoti",
        name: "Jyoti Didi",
        quote: "Like a steady light that illuminates the darkest paths, your positive spirit and vibrant energy continue to inspire everyone around you.",
        img: ""
      },
      {
        id: "punam",
        name: "Punam Didi",
        quote: "Your gentle nature and unwavering support are treasures beyond measure. Thank you for always standing strong and bringing balance to our family.",
        img: ""
      },
      {
        id: "reeta",
        name: "Reeta Didi",
        quote: "The patience and care you show to everyone around you is deeply admirable. Your presence is a constant reminder of true dedication.",
        img: ""
      },
      {
        id: "bharti",
        name: "Bharti Didi",
        quote: "Bringing endless cheer and brightness into our days, your cheerful heart and helpful spirit make every celebration much more special.",
        img: ""
      },
      {
        id: "lakshmi",
        name: "Lakshmi",
        quote: "Your vibrant energy, unique perspective, and wonderful grace add a brilliant spark to our entire family dynamic.",
        img: ""
      },
      {
        id: "khushboo",
        name: "Khushboo Didi",
        quote: "Your thoughtful words and sweet disposition leave a lasting, positive impression on everyone fortunate enough to know you.",
        img: ""
      },
      {
        id: "kajal",
        name: "Kajal Didi",
        quote: "Your creative mind and energetic presence always keep things exciting. Thank you for being such a wonderful presence in our lives.",
        img: ""
      },
      {
        id: "kalpana",
        name: "Kalpana",
        quote: "With a sharp mind and a caring heart, your unique capabilities and ambitions make us all immensely proud.",
        img: ""
      },
      {
        id: "rani",
        name: "Rani",
        quote: "Your cheerful attitude and graceful charm bring a wonderful royal elegance to our family bond. Stay bright always.",
        img: ""
      }
    ];

    function verifyMasterKey() {
      const input = document.getElementById('masterInput').value.trim().toLowerCase();
      const errorEl = document.getElementById('lockError');

      if (input === MASTER_KEY) {
        document.getElementById('lockScreen').classList.remove('active');
        document.getElementById('hubScreen').classList.add('active');
        renderHubGrid();
      } else {
        errorEl.style.display = 'block';
        document.getElementById('masterInput').value = '';
        document.getElementById('masterInput').focus();
      }
    }

    function renderHubGrid() {
      const grid = document.getElementById('sistersGrid');
      grid.innerHTML = '';

      sistersData.forEach(sister => {
        const card = document.createElement('div');
        card.className = 'sister-hub-card';
        card.onclick = () => openDetailScreen(sister);

        let imageContent = `<span style="font-size: 10px; color: #ff85a2; text-align:center; font-family: 'Montserrat', sans-serif;">Add Pic</span>`;
        if (sister.img) {
          imageContent = `<img src="${sister.img}" alt="${sister.name}">`;
        }

        card.innerHTML = `
          <div class="square-photo-box">${imageContent}</div>
          <div class="card-info">
            <h3>${sister.name}</h3>
            <span>Read Note ✨</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openDetailScreen(sister) {
      document.getElementById('hubScreen').classList.remove('active');
      document.getElementById('detailScreen').classList.add('active');

      document.getElementById('detailTitle').innerText = sister.name;
      document.getElementById('detailQuote').innerText = `"${sister.quote}"`;

      const photoBox = document.getElementById('detailPhotoContainer');
      if (sister.img) {
        photoBox.innerHTML = `<img src="${sister.img}" alt="${sister.name}">`;
      } else {
        photoBox.innerHTML = `<span style="font-size: 11px; color: #ff85a2; display: flex; align-items: center; justify-content: center; height: 100%; font-family: 'Montserrat', sans-serif;">Add Pic</span>`;
      }
    }

    function goBackToHub() {
      document.getElementById('detailScreen').classList.remove('active');
      document.getElementById('hubScreen').classList.add('active');
    }

    document.getElementById('masterInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        verifyMasterKey();
      }
    });

    // Lightweight Particle Sparkle Rain Effect
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2.5 + 0.5,
        speedY: Math.random() * 0.6 + 0.2,
        opacity: Math.random() * 0.5 + 0.2
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(255, 133, 162, 0.7)";
      
      particles.forEach(p => {
        ctx.globalAlpha = p.opacity;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.y -= p.speedY;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
